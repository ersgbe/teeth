cookies:{t:'Политика cookie', html:`

<h3>1. Общие положения</h3>

<p>1.2. Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» и Федеральным законом от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» и является дополнением к Политике в отношении обработки персональных данных.</p>
<p>1.3. Cookie — небольшие текстовые файлы, которые сохраняются в браузере пользователя при посещении сайта. Аналогичные технологии включают локальное хранилище браузера (localStorage, sessionStorage), пиксели и метки в адресе страницы (utm_*, yclid).</p>

<h3>2. Правовой статус</h3>
<p>2.1. Сами по себе cookie не всегда позволяют установить личность пользователя. Однако в сочетании с IP-адресом, сведениями об устройстве, именем и номером телефона, указанными в форме, они могут относиться к персональным данным. Поэтому Оператор обрабатывает такие данные в соответствии с законодательством о персональных данных.</p>
<p>2.2. Cookie, необходимые для работы Сайта, обрабатываются на основании законного интереса Оператора в обеспечении функционирования Сайта. Аналитические и рекламные cookie используются при наличии согласия пользователя, которое выражается в продолжении использования Сайта после ознакомления с настоящей Политикой либо в настройках браузера.</p>

<h3>3. Какие cookie мы используем</h3>
<ul>
<li><b>Необходимые.</b> Идентификатор сессии, прогресс прохождения опроса, сохранение имени и телефона для повторного визита. Без них Сайт не сможет корректно работать. Хранятся в браузере до удаления или в течение сессии.</li>
<li><b>Аналитические.</b> Сервис Яндекс Метрика собирает данные о посещаемости, источниках переходов, глубине просмотра, устройствах, а также, при включении, записывает действия на странице (вебвизор, карты кликов и скроллинга). Данные используются в обобщённом виде для улучшения Сайта. Сроки хранения определяются политикой сервиса, как правило до 12 месяцев.</li>
<li><b>Рекламные.</b> Метки в адресе страницы и идентификаторы Яндекс Директа позволяют определить, с какого объявления перешёл пользователь, и оценить стоимость и результативность рекламы. Оператор не использует их для сопоставления с профилями в других источниках.</li></ul>

<h3>4. Передача данных сервисам аналитики</h3>
<p>4.1. Данные, собранные с помощью cookie, могут передаваться поставщикам сервисов аналитики и рекламы на основании их пользовательских соглашений и политик конфиденциальности. Для Яндекс Метрики применяются условия использования сервиса и политика конфиденциальности ООО «Яндекс».</p>
<p>4.2. Оператор не продаёт данные, собранные с помощью cookie, и не использует их для принятия решений, порождающих юридические последствия для пользователя.</p>

<h3>5. Сроки хранения</h3>
<p>Сессионные cookie удаляются при закрытии браузера. Постоянные cookie и записи локального хранилища сохраняются до момента их удаления пользователем, но не дольше 12 месяцев с момента установки, если иное не указано поставщиком соответствующего сервиса. Сведения об уровне активности, не позволяющие идентифицировать пользователя, могут храниться в обезличенном виде.</p>

<h3>6. Как управлять и отключить cookie</h3>
<p>6.1. Пользователь может запретить сохранение cookie, удалить уже сохранённые файлы или настроить уведомления о них в настройках браузера (Яндекс Браузер, Chrome, Safari, Firefox, Edge и др.).</p>
<p>6.2. Для отказа от сбора статистики Яндекс Метрикой можно воспользоваться специальным дополнением для браузера, предоставляемым Яндексом, либо включить в браузере запрет на отслеживание.</p>
<p>6.3. Отключение необходимых cookie может привести к тому, что опрос не будет сохранять прогресс, а форма — работать корректно. Отключение аналитических cookie на функциональность Сайта не влияет.</p>

<h3>7. Согласие и отказ</h3>
<p>7.1. Продолжая использовать Сайт, пользователь выражает согласие на использование cookie на условиях настоящей Политики.</p>
<p>7.2. Пользователь, не согласный с использованием cookie, должен отключить их в настройках браузера или прекратить использование Сайта.</p>
<p>7.3. Согласие на обработку имени и номера телефона даётся отдельно через форму на Сайте и не может быть заменено согласием на использование cookie.</p>

<h3>8. Изменения и контакты</h3>
<p>Оператор вправе изменять Политику. Новая редакция вступает в силу с момента публикации на Сайте. По вопросам, связанным с использованием cookie, можно обратиться на {{EMAIL}}.</p>`},

function updateProg(){
  const max=rb.scrollHeight-rb.clientHeight;
  $('rprog').style.width=(max>0?Math.min(100,rb.scrollTop/max*100):0)+'%';
  if(rb.classList.contains('pdfv') && pageEls.length){
    const y=rb.scrollTop+rb.clientHeight*.35; let cur=0;
    for(let i=0;i<pageEls.length;i++){ if(pageEls[i].offsetTop<=y) cur=i; else break; }
    if(max-rb.scrollTop<4) cur=pageEls.length-1;
    $('pgInd').textContent=(cur+1)+' / '+pageEls.length;

function loadPdfJs(){
  if(pdfLibP) return pdfLibP;
  pdfLibP=(async()=>{
    const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=B+'pdf.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
    const w=await (await fetch(B+'pdf.worker.min.js')).text();   // воркер через blob, чтобы не упираться в CORS
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
    return window.pdfjsLib;
  })();
  pdfLibP.catch(()=>{ pdfLibP=null; });
  return pdfLibP;
}

async function renderPdf(my, keepPos){
  const ratio = keepPos && rb.scrollHeight ? rb.scrollTop/rb.scrollHeight : 0;
  const n=pdfDoc.numPages, list=[];
  rb.className='pdfv'; rb.innerHTML=''; pageEls=[];
  const W=rb.clientWidth||800, dpr=Math.min(window.devicePixelRatio||1,2);
  renderedW=W;
  for(let i=1;i<=n;i++){
    const p=await pdfDoc.getPage(i); if(my!==rtoken) return;
    const base=p.getViewport({scale:1}), vp=p.getViewport({scale:W/base.width*dpr});
    const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    rb.appendChild(cv); pageEls.push(cv); list.push({p,vp,cv});
  }
  rb.scrollTop = ratio*rb.scrollHeight;
  updateProg();
  for(const {p,vp,cv} of list){
    if(my!==rtoken) return;
    await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    cv.classList.add('ok');
  }
}

let dlBusy=false;
async function downloadPdf(){
  goal('guide_download');
  if(!CONFIG.PDF_URL) return alert('Здесь начнётся скачивание. Добавьте ссылку в CONFIG.PDF_URL.');
  if(dlBusy) return; dlBusy=true;
  const btns=[$('dl'),$('dl2')], lab=$('dlTxt');
  btns.forEach(b=>b.classList.add('busy')); lab.textContent='Скачиваем…';
  const save=href=>{ const a=document.createElement('a'); a.href=href; a.download=CONFIG.PDF_NAME; document.body.appendChild(a); a.click(); a.remove(); };
  try{
    const r=await fetch(CONFIG.PDF_URL); if(!r.ok) throw new Error('HTTP '+r.status);
    const b=await r.blob();
    const u=URL.createObjectURL(b.type==='application/pdf'?b:new Blob([b],{type:'application/pdf'}));
    save(u); setTimeout(()=>URL.revokeObjectURL(u),10000);
  }catch(err){ save(CONFIG.PDF_URL); }
  btns.forEach(b=>b.classList.remove('busy')); lab.textContent='Готово ✓';
  setTimeout(()=>{ lab.textContent='Скачать PDF'; dlBusy=false; },1600);
}
$('dl').addEventListener('click',downloadPdf);
$('dl2').addEventListener('click',downloadPdf);
